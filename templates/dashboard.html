
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>{{ page_title }}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="auth-card">
        <h1>{{ page_title }}</h1>

        <p>歡迎，{{ user.username }}</p>

        {% if user.role == "author" %}
            <h2>我的投稿</h2>
            <p>下一階段加入文章新增、編輯、刪除與送審功能。</p>
        {% elif user.role == "editor" %}
            <h2>待審查文章</h2>
            <p>下一階段加入文章審查、通過與退稿功能。</p>
        {% endif %}

        <form method="post" action="/logout">
            <button type="submit">登出</button>
        </form>
    </div>
</body>
</html>
